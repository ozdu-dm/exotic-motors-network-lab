# VM101 (DMZ) — 192.168.100.10
# Puerto 80: acceso desde EC2/WireGuard (sin redirect HTTPS)
server {
    listen 80;
    server_name _;
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control     "no-store, no-cache, must-revalidate";
    }
}

# Puerto 443: acceso desde red interna (cert autofirmado)
server {
    listen 443 ssl;
    server_name www.exoticmotors.proven;

    ssl_certificate     /etc/nginx/ssl/apexmotors.crt;
    ssl_certificate_key /etc/nginx/ssl/apexmotors.key;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control     "no-store, no-cache, must-revalidate";
    }
}
