<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>EXOTIC MOTORS | Concesionario Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS DE LUJO GLOBALES --- */
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .gold-accent { color: #d4af37; text-shadow: 0 0 5px rgba(212, 175, 55, 0.5); } 
        
        /* Navbar Pegajoso y Polished */
        .navbar { background-color: rgba(0, 0, 0, 0.9) !important; backdrop-filter: blur(10px); border-bottom: 1px solid #222; transition: all 0.3s; }
        .navbar-brand { font-weight: 900; letter-spacing: 2px; font-size: 1.5rem; }
        
        /* BOTONES PREMIUM (Con efecto de pulso y brillo) */
        .btn-gold { 
            background: linear-gradient(45deg, #d4af37, #f1d57e); 
            color: black; font-weight: bold; border: none; 
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            position: relative; overflow: hidden;
        }
        .btn-gold:hover { 
            background: linear-gradient(45deg, #f1d57e, #d4af37);
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); color: black;
        }
        
        /* Botones Outline con Brillo */
        .btn-outline-gold {
            border: 2px solid #d4af37; color: #d4af37; font-weight: 600;
            background: transparent; transition: all 0.3s;
        }
        .btn-outline-gold:hover {
            background-color: #d4af37; color: black; transform: scale(1.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* Cartas con Hover Avanzado */
        .card-premium {
            background-color: #161616; border: 1px solid #222; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-premium:hover {
            transform: translateY(-10px) scale(1.02); border-color: #d4af37;
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2);
        }

        /* Nav links uniformes — activo y hover en blanco */
        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.6) !important;
            transition: color 0.2s ease;
        }
        .navbar .nav-link:hover,
        .navbar .nav-link.nav-active {
            color: #ffffff !important;
        }

        /* Animaciones de Entrada */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeInUp 0.8s ease-out forwards; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container py-1">
            <a class="navbar-brand" href="/"><span class="gold-accent">EXOTIC</span> MOTORS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link px-3 {% if request.path == '/' %}nav-active{% endif %}" href="/"><i class="fas fa-home me-1"></i> Inicio</a>
                    <a class="nav-link px-3 {% if request.path == '/inventario' or request.path.startswith('/coche') %}nav-active{% endif %}" href="/inventario"><i class="fas fa-car me-1"></i> Inventario</a>
                    <a class="nav-link px-3 {% if request.path == '/mis_reservas' %}nav-active{% endif %}" href="/mis_reservas"><i class="fas fa-search-location me-1"></i> Mis Reservas</a>
                    <a class="nav-link px-3 {% if request.path == '/login' %}nav-active{% endif %}" href="/login" title="Acceso empleados"><i class="fas fa-lock" style="font-size:0.85rem; opacity:0.6;"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5 pt-3 animate-fade-up">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-black text-secondary mt-5 py-5 border-top border-secondary">
        <div class="container">
            <div class="row g-4 text-center text-md-start">
                <div class="col-md-4">
                    <h5 class="text-white fw-bold mb-3"><span class="gold-accent">EXOTIC</span> MOTORS</h5>
                    <p class="small">Líderes en importación y venta de vehículos premium y de ocasión certificados.</p>
                </div>
                <div class="col-md-4 text-center">
                    <h6 class="text-white mb-3">Contacto</h6>
                    <p class="small mb-1"><i class="fas fa-phone me-1"></i> +34 91 000 00 00</p>
                    <p class="small mb-0"><i class="fas fa-envelope me-1"></i> info@exoticmotors.es</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <p class="small m-0">&copy; 2026 EXOTIC MOTORS S.L.</p>
                    <p class="small">C/ Lujo 1, Madrid</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
