{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 animate-fade-up">
        <div class="card bg-black border border-secondary shadow-lg overflow-hidden" style="border-radius: 15px;">
            
            <div class="position-relative">
                <img src="{{ coche.img }}" class="img-fluid w-100" style="height: 280px; object-fit: cover; opacity: 0.8;">
                <div class="position-absolute bottom-0 start-0 p-4 w-100" style="background: linear-gradient(transparent, rgba(0,0,0,0.9));">
                    <span class="badge bg-gold text-dark fw-bold mb-2">SOLICITUD DE RESERVA</span>
                    <h2 class="fw-bold text-white m-0">{{ coche.marca }} <span class="gold-accent">{{ coche.modelo }}</span></h2>
                </div>
            </div>

            <div class="card-body p-4">
                <div class="p-3 bg-dark rounded border border-secondary mb-4 d-flex align-items-center justify-content-between">
                    <div>
                        <small class="text-muted d-block">CLIENTE AUTENTICADO</small>
                        <span class="text-white fw-bold fs-5"><i class="fas fa-crown gold-accent me-2"></i>{{ nombre_vip }}</span>
                    </div>
                    <div class="text-end">
                        <small class="text-muted d-block">DOCUMENTO DNI</small>
                        <span class="text-secondary small fw-bold">{{ dni_vip }}</span>
                    </div>
                </div>

                <form method="POST" action="/reserva/{{ coche.id }}">
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold tracking-wide">
                            <i class="fas fa-comment-dots gold-accent me-1"></i> ¿TIENES ALGUNA ESPECIFICACIÓN O COMENTARIO PARA TU ASESOR?
                        </label>
                        <textarea name="mensaje" class="form-control bg-black border-secondary text-white p-3" rows="4" placeholder="Ej: Me gustaría probarlo con las llantas de fibra de carbono... / Solicito cita para fin de semana." autofocus></textarea>
                    </div>

                    <input type="hidden" name="telefono" value="">

                    <div class="row g-2">
                        <div class="col-6">
                            <a href="/inventario" class="btn btn-outline-secondary w-100 py-3 fw-bold text-uppercase">Volver atrás</a>
                        </div>
                        <div class="col-6">
                            <button type="submit" class="btn btn-gold w-100 py-3 fw-bold text-uppercase shadow">Confirmar Reserva</button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<style>
    .bg-black { background-color: #000 !important; }
    .gold-accent { color: #d4af37 !important; }
    .btn-gold { background-color: #d4af37; color: #000; border: none; }
    .btn-gold:hover { background-color: #b8962e; color: #000; }
    .form-control:focus { border-color: #d4af37 !important; box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25); }
</style>
{% endblock %}
